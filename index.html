<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Moto Vaulttt</title><style id="css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f3;--card:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--ac:#e8590c;--ac2:#fff;--bd:#e3e0db;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1d1d1d;--tx:#f2f2f2;--mu:#9a9a9a;--ac:#ff7a29;--ac2:#111;--bd:#2c2c2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--card:#1d1d1d;--tx:#f2f2f2;--mu:#9a9a9a;--ac:#ff7a29;--ac2:#111;--bd:#2c2c2c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;letter-spacing:1px}.logo b{color:var(--ac)}.logo{display:flex;align-items:center;gap:10px}.logo img{height:46px;width:46px;object-fit:contain;display:block}
nav{display:flex;gap:4px}nav button{background:none;border:0;color:var(--tx);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--ac);color:var(--ac2)}
main{max-width:980px;margin:0 auto;padding:16px}
h1,h2{margin:.2em 0 .5em}.hero{padding:22px 16px;border-radius:14px;background:var(--card);border:1px solid var(--bd);margin-bottom:16px}.hero p{color:var(--mu);margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:150px;display:flex;align-items:center;justify-content:center;font-size:64px;background:var(--bg)}.pic img{width:100%;height:100%;object-fit:cover}.pic{position:relative;overflow:hidden}.gal{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.gal img{flex:0 0 100%;scroll-snap-align:center}.cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}.th{position:relative;display:inline-block;margin:6px 8px 2px 0}.th img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block}.th button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;padding:0;line-height:22px;font-size:16px}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.cat{font-size:12px;color:var(--mu);text-transform:uppercase}.price{font-weight:800;font-size:18px}.d{color:var(--mu);font-size:14px;flex:1}
button.p,a.p{background:var(--ac);color:var(--ac2);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}button.p:disabled{opacity:.4}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}textarea{min-height:90px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .n{flex:0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.mu{color:var(--mu)}.tot{font-size:20px;font-weight:800;text-align:right;margin:12px 0}footer{text-align:center;color:var(--mu);padding:24px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

function send(kind,text,subj){const s=D.settings;let out;if(kind==='wa'){if(!s.whatsapp)return note('The seller has not added a WhatsApp number yet. Please use email.');out={text:text,href:'https://wa.me/'+s.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(text),label:'Open WhatsApp'}}else{if(!s.email)return note('The seller has not added an email yet. Please use WhatsApp.');out={text:text,href:'mailto:'+s.email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(text),label:'Open Email app'}}orderOut=out;render()}
const orderText=()=>'New order from Moto Vaulttt\n\n'+cartItems().map(x=>x.q+' x '+x.p.name+' ('+money(x.p.price*x.q)+')').join('\n')+'\n\nTotal: '+money(cartT())+'\nName: '+(f.cn||'')+'\nPhone: '+(f.cp||'')+'\nAddress: '+(f.ca||'');
const g=id=>$('#'+id).value;
document.addEventListener('input',e=>{if(e.target.id)f[e.target.id]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='ai'&&e.target.files.length){[...e.target.files].slice(0,Math.max(0,5-imgs.length)).forEach(file=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{if(imgs.length>=5)return;const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);imgs.push(c.toDataURL('image/jpeg',.7));drawThumbs()};i.src=r.result};r.readAsDataURL(file)});e.target.value=''}});
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('gal')){const n=Math.round(t.scrollLeft/t.clientWidth),c=t.parentNode.querySelector('.cnt');if(c)c.textContent=(n+1)+'/'+t.children.length}},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,x=b.dataset.v;
if(a==='nav'){route=x;orderOut=null;history.replaceState(null,'','#'+x)}
else if(a==='cat')cat=x;else if(a==='add'){const p=D.products.find(p=>p.id===x);if((cart[x]||0)<p.stock)cart[x]=(cart[x]||0)+1}
else if(a==='dec')cart[x]=Math.max(0,(cart[x]||0)-1);
else if(a==='ordwa'||a==='ordmail'){if(!f.cn||!f.cp||!f.ca)return note('Please fill in your name, phone and address.');send(a==='ordwa'?'wa':'mail',orderText(),'New order - Moto Vaulttt');return}
else if(a==='msgwa'||a==='msgmail'){if(!f.mm)return note('Please write a message.');send(a==='msgwa'?'wa':'mail','Message from '+(f.mn||'a customer')+':\n\n'+f.mm,'Message from '+(f.mn||'a customer'));return}
else if(a==='edit'){editId=x;const q=D.products.find(p=>p.id===x)||{};imgs=(q.imgs&&q.imgs.length?q.imgs:(q.img?[q.img]:[])).slice()}else if(a==='rmimg'){imgs.splice(+x,1);drawThumbs();return}else if(a==='cancel'){editId=null;imgs=[]}
else if(a==='login'){const t=(g('tk')||'').trim();if(!t)return note('Please paste your token.');tok=t;try{localStorage.setItem('mvtok',t)}catch(er){}}
else if(a==='logout'){tok='';try{localStorage.removeItem('mvtok')}catch(er){}}
else if(a==='del'){pend=x}else if(a==='delno'){pend=null}else if(a==='delyes'){D.products=D.products.filter(p=>p.id!==x);pend=null;if(editId===x)editId=null;delete cart[x];render();return save()}
else if(a==='copy'){const t=orderOut&&orderOut.text||'';const fb=()=>{const ta=$('#oo');if(ta)ta.select();note('Select the text above and copy it.')};try{navigator.clipboard.writeText(t).then(()=>note('Copied! Paste it in a message to the seller.'),fb)}catch(er){fb()}return}
else if(a==='saveP'){if(!g('an')||!g('ap'))return note('Name and price are required.');const old=D.products.find(p=>p.id===editId)||{},p={id:old.id||pid(),name:g('an'),price:+g('ap'),stock:+g('as')||0,cat:(()=>{const c=String(g('ac')||'').trim(),m=D.products.find(q=>q.cat&&q.cat.trim().toLowerCase()===c.toLowerCase());return m?m.cat.trim():c})(),emoji:g('ae'),desc:g('ad'),imgs:imgs.slice(),img:imgs[0]||''};D.products=old.id?D.products.map(q=>q.id===p.id?p:q):[...D.products,p];editId=null;imgs=[];return save()}
else if(a==='saveS'){D.settings={whatsapp:g('sw'),email:g('se'),cur:g('sc')||'$',tagline:g('st')};return save()}
render()});

render();
